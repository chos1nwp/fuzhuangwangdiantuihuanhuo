# 服装网店退换货处理系统 · 容器编排
# 启动：docker compose up -d --build
# 停止：docker compose down
# 清空数据：docker compose down -v

name: clothes-after-sale

services:
  # ---------------- 数据库 ----------------
  mysql:
    image: mysql:8.0
    container_name: clothes-mysql
    restart: unless-stopped
    environment:
      # 演示默认密码；正式使用请改掉（改后需删除数据卷重建，见部署说明）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cloth_demo_2026}
      # 首次启动自动建库，应用启动时会自动建表并写入模拟数据
      MYSQL_DATABASE: ${DB_NAME:-clothes_after_sale}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      # 命名卷：删除容器不会丢数据
      - mysql-data:/var/lib/mysql
    ports:
      # 只监听本机，方便用客户端连库调试；不与本机已装的 MySQL(3306) 冲突
      - "127.0.0.1:${MYSQL_PUBLISH_PORT:-3307}:3306"
    healthcheck:
      # 数据库初始化要几十秒，健康后再启动应用，避免启动即报连接失败
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------- 应用 ----------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: clothes-after-sale:1.1.0
    container_name: clothes-app
    restart: unless-stopped
    # tini 作为 1 号进程，正确转发 Ctrl+C / docker stop 信号
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 容器之间用服务名互相访问，这里的 DB_HOST 就是上面的服务名 mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cloth_demo_2026}
      DB_NAME: ${DB_NAME:-clothes_after_sale}
      TZ: Asia/Shanghai
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  mysql-data:
    name: clothes-mysql-data
